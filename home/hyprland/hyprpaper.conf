# hyprpaper — wallpapers. Started by `exec-once = hyprpaper` in hyprland.conf.
#
# Written for hyprpaper 0.8.x, the version in Arch's extra repo. That release
# replaced the old config format: `preload = <file>` followed by
# `wallpaper = <monitor>,<file>` no longer exists, and every example still using
# it is out of date. Everything is now a `wallpaper { }` block.
#
# Apply a change without restarting the session:
#
#   hyprctl reload            # reloads hyprland.conf, not this file
#   killall hyprpaper && hyprpaper &
#
# Monitor names come from the same place as monitors.conf:
#
#   hyprctl monitors all

# The version banner hyprpaper draws over the wallpaper. Off, to match
# `disable_hyprland_logo = true` in hyprland.conf.
splash = 0

# ---- Every screen -------------------------------------------------------------
# An empty monitor is the wildcard — `*` works too — so this one block covers
# all three screens, and any fourth that gets plugged in later.
#
# Blocks are keyed by their `monitor` value, so two blocks naming the same
# monitor do not stack: the second silently replaces the first. One block per
# screen, and at most one wildcard.
#
#   path       must be absolute or start with ~. A relative path here is NOT
#              resolved against this file's directory (only `source =` is), so
#              it would end up relative to hyprpaper's working directory.
#              Symlinks are resolved, which is why pointing into ~/.config works
#              even though the directory is symlinked out of the repo. It sits
#              at ~/.config/wallpapers rather than under hypr/ from when a
#              second compositor read the same images; harmless where it is.
#   fit_mode   cover (default) | contain | tile | fill. `fill` stretches and
#              ignores aspect ratio; `cover` crops to fill; `contain` letterboxes.
#              Anything unrecognised silently falls back to cover.
wallpaper {
    monitor =
    path = ~/.config/wallpapers/solid-414550.png
    fit_mode = cover
}

# The shipped default is a flat #414550 — the same grey as the inactive border
# in hypr_extra.lua, so all three screens come up matching instead of black.
# Drop real images into
# ~/.config/wallpapers/ and point the blocks below at them.

# ---- Per screen ---------------------------------------------------------------
# A named block wins over the wildcard for that monitor. Fill in the real names
# and uncomment to give each screen its own wallpaper.
#
#   wallpaper {
#       monitor = DP-1
#       path = ~/.config/wallpapers/left.png
#       fit_mode = cover
#   }
#
#   wallpaper {
#       monitor = eDP-1
#       path = ~/.config/wallpapers/centre.png
#       fit_mode = cover
#   }
#
#   wallpaper {
#       monitor = HDMI-A-1
#       path = ~/.config/wallpapers/right.png
#       fit_mode = cover
#   }
#
# `desc:` matches the display's EDID string instead of the port, same as in
# monitors.conf, and survives moving a cable to a different socket:
#
#   monitor = desc:Dell Inc. DELL U2720Q ABC123

# ---- Slideshow ----------------------------------------------------------------
# Point path at a directory instead of a file and hyprpaper rotates through
# every image in it, up to 1024 of them.
#
#   wallpaper {
#       monitor =
#       path = ~/.config/wallpapers
#       timeout = 900              # seconds between images; 0 means never rotate
#       order = random             # default | random | random-shuffle
#       recursive = 1              # also descend into subdirectories
#   }
#
# Note that a directory picks up the solid-colour default shipped here as well,
# so move it out first if you do not want it in the rotation.
